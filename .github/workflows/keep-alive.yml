name: Keep Services Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Service Health Endpoints
        run: |
          URLS=(
            "https://service-gateway-hj9u.onrender.com/health"
            "https://service-users-hj9u.onrender.com/health"
            "https://service-farms-hj9u.onrender.com/health"
            "https://service-marketplace-hj9u.onrender.com/health"
            "https://service-community-hj9u.onrender.com/health"
            "https://service-chat-hj9u.onrender.com/health"
            "https://service-diagnostics-hj9u.onrender.com/health"
          )
          
          for URL in "${URLS[@]}"; do
            echo "Pinging ${URL}..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
              # Note: Some services might return 404 for /health if not implemented, 
              # but the ping still keeps the instance alive.
              echo "✅ Received $RESPONSE from ${URL}"
            else
              echo "❌ Failed to reach ${URL} (Status: $RESPONSE)"
            fi
          done
