envVarGroups:
  - name: project-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_CONTENT
        sync: false
services:
  - type: web
    name: service-users
    env: python
    rootDir: backend/service-users
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FRONTEND_URL
        value: https://frontend-kappa-steel-ermse818vz.vercel.app

  - type: web
    name: service-gateway
    env: python
    rootDir: backend/service-gateway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SERVICE_USERS_URL
        fromService:
          name: service-users
          type: web
          property: host
      - key: SERVICE_FARMS_URL
        fromService:
          name: service-farms
          type: web
          property: host
      - key: SERVICE_MARKETPLACE_URL
        fromService:
          name: service-marketplace
          type: web
          property: host
      - key: SERVICE_COMMUNITY_URL
        fromService:
          name: service-community
          type: web
          property: host
      - key: SERVICE_CHAT_URL
        fromService:
          name: service-chat
          type: web
          property: host

  - type: web
    name: service-farms
    env: python
    rootDir: backend/service-farms
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: service-marketplace
    env: python
    rootDir: backend/service-marketplace
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: service-community
    env: python
    rootDir: backend/service-community
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: service-chat
    env: python
    rootDir: backend/service-chat
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

envVars:
  - key: DATABASE_URL
    sync: false
  - key: FIREBASE_API_KEY
    sync: false
  - key: FIREBASE_SERVICE_ACCOUNT_JSON_CONTENT
    sync: false
